<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head>
    <meta charset="UTF-8">
    <title>Turistattraktioner</title>
    <link th:href="@{/style.css}" rel="stylesheet">
</head>
<body>

<h1>Turistattraktioner:</h1>

<table>
    <tr>
        <th></th>
        <th>Navn</th>
        <th>Beskrivelse</th>
        <th>By</th>
        <th></th>
    </tr>
    <tr th:each="attraction : ${attractions}">
        <td>
            <img th:if="${attraction.image}" th:src="@{'/images/' + ${attraction.image}}" alt="logo" class="thumb">
        </td>
        <td th:text="${attraction.name}"></td>
        <td th:text="${attraction.description}"></td>
        <td th:text="${attraction.city}"></td>
        <td class="actions">
            <a th:href="@{/attractions/{name}/edit(name=${attraction.name})}">
                <button type="button">Opdater</button>
            </a>
            <form th:action="@{/attractions/delete/{name}(name=${attraction.name})}" method="post">
                <button type="submit">Slet</button>
            </form>
            <a th:href="@{/attractions/{name}/tags(name=${attraction.name})}">
                <button type="button">Tags</button>
            </a>
        </td>
    </tr>
</table>

<a th:href="@{/attractions/add}">
    <button type="button">Tilføj attraktion</button>
</a>

</body>
</html>
