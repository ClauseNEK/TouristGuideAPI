spring.application.name=TouristGuideAPI

# --- Database Azure Database for MySQL ---
spring.datasource.url=${DB_URL:jdbc:mysql://testofnewsystem-mysql.mysql.database.azure.com:3306/turistguide?sslMode=REQUIRED&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:turistadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Kører scheme.sql & data.sql ved opstart
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:Sql/schema.sql
spring.sql.init.data-locations=classpath:Sql/data.sql
spring.sql.init.encoding=UTF-8
