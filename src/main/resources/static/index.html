<!-- bruger ! + tab for en html template -->


<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Turistguide | København</title>
    <!-- Her linker vi til vores stylesheet så HTML og CSS ikke ligger i en samlet fil --->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- H1 (Overskrift) -->
<h1>Velkommen til Turistguide København</h1>

<!-- Her laver vi en paragraf -->
<p>
    Her kan du se nogle af de mest kendte attraktioner i København.
</p>

<!-- Opretter en Navigation med en href -->
<!-- Tivoli eksempel -->
<nav>
    <ul>
        <li><a href="/attractions">Se alle attraktioner (JSON)</a></li>
    </ul>
</nav>

<!-- H2 Overskrift -->
<h2>Attraktioner</h2>


<!-- Laver div og definerer med en class til css -->
<div class="attraktion">
    <a href="/attractions/tivoli">
        <img src="images/tivoli.png" alt="Tivoli">
        <p>Tivoli</p>
    </a>
</div>

<div class="attraktion">
    <a href="/attractions/bakken">
        <img src="images/bakken_logo_2026.png" alt="Bakken">
        <p>Bakken</p>
    </a>
</div>

<div class="attraktion">
    <a href="/attractions/vega">
        <img src="images/vega.png" alt="Vega">
        <p>Vega</p>
    </a>
</div>

<div class="attraktion">
    <a href="/attractions/royal">
        <img src="images/royalarena.png" alt="Royal Arena">
        <p>Royal Arena</p>
    </a>
</div>

<div class="attraktion">
    <a href="/attractions/turistinformation">
        <img src="images/turistinformation.png" alt="Turistinformation">
        <p>Turistinformation</p>
    </a>
</div>

<!-- Opretter en footer som også skal have en fast placering af css i bunden -->

<footer>
    <p>Kontakt Turisttosserne | turisttosserne@mail.dk</p>
</footer>

</body>
</html>
