name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Hent kildekoden fra repositoryet
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Sæt Java op
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Kør Maven tests
      - name: Build with Maven
        run: mvn test